server:
  port: 8080

spring:
  application:
    name: ecommerce-catalog
  datasource:
    url: jdbc:h2:mem:catalogdb;DB_CLOSE_DELAY=-1;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true

catalog:
  seed:
    enabled: true
    productCount: 5000

logging:
  level:
    org.hibernate.SQL: warn
